name: tvapp
description: Player de mídia para listas do próprio usuário (M3U, HLS, Xtream Codes).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  drift: ^2.35.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  device_info_plus: ^13.0.0
  file_picker: ^12.0.0
  http: ^1.2.2
  video_player: ^2.10.0
  wakelock_plus: ^1.3.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  timezone: ^0.10.0
  crypto: ^3.0.3
  flutter_secure_storage: ^10.0.0
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/demo/
