name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O zip não traz android/ e ios/ completos. O flutter create gera só o que falta
      # e não sobrescreve AndroidManifest.xml nem Info.plist que já estão no repositório.
      - name: Gerar scaffolding de plataforma
        run: flutter create --org com.jhonatanbaseggio123 --project-name tvapp --platforms android,ios .

      # O template cria test/widget_test.dart com MyApp, que não existe aqui.
      - name: Remover teste do template
        run: rm -f test/widget_test.dart

      - name: pub get
        run: flutter pub get

      - name: build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: gen-l10n
        run: flutter gen-l10n

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      # Chave de debug fixa: sem ela, cada execução assina com uma chave nova
      # e o Android recusa instalar o APK novo por cima do anterior.
      - name: Chave de debug fixa
        run: mkdir -p ~/.android && cp tool/ci/debug.keystore ~/.android/debug.keystore

      - name: build apk (debug, TV)
        run: flutter build apk --debug --dart-define=TV=true

      - uses: actions/upload-artifact@v4
        with:
          name: tvapp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Release assinado só quando os quatro segredos existem; sem eles o job
      # termina no debug. A chave entra pelas propriedades android.injected.*
      # do Android Gradle Plugin, sem mexer no build.gradle gerado.
      - name: Preparar assinatura de release
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Segredos de assinatura ausentes: só o build de debug."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "android.injected.signing.store.file=$KS"
            echo "android.injected.signing.store.password=$KEYSTORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$KEY_PASSWORD"
          } >> android/gradle.properties
          SHA=$(keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: build apk e aab (release, TV)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          flutter build apk --release --dart-define=TV=true --build-number=${{ github.run_number }}
          flutter build appbundle --release --dart-define=TV=true --build-number=${{ github.run_number }}

      # Confere que saiu com a chave de release, e não com a de debug.
      - name: Conferir assinatura de release
        if: steps.signing.outputs.enabled == 'true'
        env:
          EXPECTED: ${{ steps.signing.outputs.sha256 }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | sed -E 's/.*digest: *//')
          echo "APK assinado com $GOT"
          test "$GOT" = "$EXPECTED"
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified"
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "AAB assinado com $AAB_SHA"
          test "$AAB_SHA" = "$EXPECTED"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: tvapp-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # macOS custa 10x os minutos do Linux: só à mão, pela aba Actions.
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --org com.jhonatanbaseggio123 --project-name tvapp --platforms android,ios .
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n

      # Sem assinatura: só confirma que compila. Instalar no iPhone exige conta Apple.
      - name: build ios (sem assinatura)
        run: flutter build ios --debug --no-codesign
